<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול BARBER PRO</title><style>body{margin:0;background:#101012;color:#f5f1e7;font:16px Arial,sans-serif}main{max-width:850px;margin:35px auto;padding:20px}h1,h2{color:#d8b45a}section{background:#202024;padding:20px;border-radius:12px;margin:15px 0}label{display:block;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;background:#111;color:white;border:1px solid #777;border-radius:6px;padding:11px;font:inherit}textarea{min-height:100px}button{background:#d8b45a;color:#151515;border:0;border-radius:7px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:8px 0 8px 8px}button.secondary{background:#444;color:white}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{padding:10px;color:#e5d08d;white-space:pre-wrap}a{color:#d8b45a}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>💈 ניהול BARBER PRO</h1><p><a href="/" target="_blank">צפייה באתר</a></p><div id="message" class="msg"></div><section id="setup" class="hidden"><h2>הגדרת מנהל ראשונה</h2><p>יש להגדיר SETUP_TOKEN בסביבת Railway לפני השימוש. אין לשלוח סיסמאות בצ׳אט.</p><label>קוד התקנה</label><input id="setupToken" type="password"><label>דוא״ל מנהל</label><input id="setupEmail" type="email"><label>סיסמה חדשה (לפחות 12 תווים)</label><input id="setupPassword" type="password"><button id="setupBtn">צור מנהל</button></section><section id="login" class="hidden"><h2>כניסה למנהל</h2><label>דוא״ל</label><input id="email" type="email"><label>סיסמה</label><input id="password" type="password"><button id="loginBtn">התחבר</button></section><div id="editor" class="hidden"><section><h2>פרטי העסק</h2><div id="fields"></div></section><section><h2>עיצוב</h2><div id="theme"></div></section><section><h2>עמודים ותוכן</h2><div id="pages"></div><button id="addPage" class="secondary">הוסף עמוד</button></section><section><h2>תמונות גלריה</h2><p>כתובת HTTPS של כל תמונה בשורה נפרדת</p><textarea id="photos" rows="6"></textarea></section><button id="publish">פרסם שינויים באתר</button><button id="logout" class="secondary">התנתק</button></div></main><script>
let data;const $=id=>document.getElementById(id),msg=t=>$('message').textContent=t;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const j=await r.json();if(!r.ok)throw Error(j.error||'שגיאה');return j}
const show=id=>{for(const x of ['setup','login','editor'])$(x).classList.toggle('hidden',x!==id)};
const fields=[['siteName','שם העסק'],['tagline','כותרת ראשית'],['subtitle','תיאור קצר'],['heroImage','קישור לתמונת רקע'],['phone','טלפון'],['whatsapp','וואטסאפ (972...)'],['address','כתובת'],['hours','שעות פתיחה']];
function field(host,key,label,value,type='text'){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type=type;i.value=value||'';i.dataset.key=key;host.append(l,i);return i}
function render(){const f=$('fields');f.replaceChildren();fields.forEach(([k,l])=>field(f,k,l,data[k]));const t=$('theme');t.replaceChildren();[['background','רקע'],['surface','משטח'],['accent','צבע הדגשה'],['text','צבע טקסט']].forEach(([k,l])=>field(t,k,l,data.theme?.[k],'color'));const label=document.createElement('label');label.textContent='גופן';const select=document.createElement('select');select.id='font';['Arial','Georgia','Tahoma','Verdana','Trebuchet MS','Times New Roman'].forEach(font=>{const o=document.createElement('option');o.textContent=font;o.value=font;select.append(o)});select.value=data.theme?.font||'Arial';t.append(label,select);const p=$('pages');p.replaceChildren();data.pages.forEach((page,i)=>{const box=document.createElement('section');const h=document.createElement('h3');h.textContent='עמוד '+(i+1);box.append(h);const title=field(box,'title','שם העמוד',page.title);const content=document.createElement('textarea');content.value=page.content||'';const l=document.createElement('label');l.textContent='תוכן';box.append(l,content);const remove=document.createElement('button');remove.className='secondary';remove.textContent='מחק עמוד';remove.onclick=()=>{data.pages.splice(i,1);render()};box.append(remove);page._inputs={title,content};p.append(box)});$('photos').value=(data.photos||[]).join('\n')}
async function load(){data=await api('/api/site');render();show('editor')}
async function start(){try{await api('/api/me');await load()}catch{try{const s=await api('/api/setup-status');show(s.needsSetup?'setup':'login')}catch(e){msg(e.message)}}}
$('setupBtn').onclick=async()=>{try{await api('/api/setup',{method:'POST',body:JSON.stringify({setupToken:$('setupToken').value,email:$('setupEmail').value,password:$('setupPassword').value})});msg('המנהל נוצר. אפשר להתחבר.');show('login')}catch(e){msg(e.message)}};
$('loginBtn').onclick=async()=>{try{await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('password').value='';msg('');await load()}catch(e){msg(e.message)}};
$('addPage').onclick=()=>{data.pages.push({id:'custom-'+Date.now(),title:'עמוד חדש',content:''});render()};
$('publish').onclick=async()=>{try{for(const [k] of fields)data[k]=$('fields').querySelector('[data-key="'+k+'"]').value;for(const k of ['background','surface','accent','text'])data.theme[k]=$('theme').querySelector('[data-key="'+k+'"]').value;data.theme.font=$('font').value;data.pages.forEach(p=>{p.title=p._inputs.title.value;p.content=p._inputs.content.value;delete p._inputs});data.photos=$('photos').value.split('\n').map(s=>s.trim()).filter(s=>/^https:\/\//.test(s));await api('/api/site',{method:'PUT',body:JSON.stringify(data)});msg('פורסם בהצלחה! השינויים זמינים באתר כעת.');render()}catch(e){msg(e.message)}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});show('login');msg('התנתקת')};start();
</script></body></html>
