<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BARBER PRO</title><meta name="description" content="אתר הדגמה למספרת גברים"><style>
:root{--bg:#101012;--surface:#1b1b20;--accent:#d8b45a;--text:#f8f5ef;--font:Arial}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font),Arial,sans-serif;line-height:1.7}a{color:inherit}header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid #ffffff22}nav{max-width:1100px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-weight:900;font-size:23px;color:var(--accent);text-decoration:none}.navlinks{display:flex;gap:18px;flex-wrap:wrap}.navlinks a{text-decoration:none;font-size:14px}.navlinks a:hover{color:var(--accent)}
.hero{min-height:480px;display:grid;place-items:center;text-align:center;padding:80px 20px;background:linear-gradient(#000a,#000c),var(--hero) center/cover}.hero h1{font-size:clamp(35px,6vw,65px);margin:10px 0;color:var(--accent)}.hero p{font-size:20px}.btn{display:inline-block;background:var(--accent);color:#111;padding:12px 25px;border-radius:7px;text-decoration:none;font-weight:bold;margin:10px}.wrap{max-width:1100px;margin:auto}section{padding:65px 20px;border-bottom:1px solid #ffffff12}h2{color:var(--accent);font-size:clamp(26px,4vw,38px);margin:0 0 20px}.bodytext{white-space:pre-line;font-size:18px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.photos img{width:100%;height:260px;object-fit:cover;border-radius:12px}.panel{background:var(--surface);padding:25px;border-radius:12px}footer{text-align:center;padding:30px;color:#bbb;font-size:13px}.demo{background:#382e17;padding:9px 18px;text-align:center;color:#ffdf92;font-size:13px}@media(max-width:650px){nav{justify-content:center}.navlinks{justify-content:center}.photos{grid-template-columns:1fr}.photos img{height:230px}}
</style></head><body><div class="demo">אתר הדגמה — הפרטים והמחירים להמחשה בלבד</div><header><nav><a href="#" class="brand" id="brand">BARBER PRO</a><div class="navlinks" id="navlinks"></div></nav></header><div class="hero" id="top"><div><div>💈 BARBER PRO</div><h1 id="headline">סטייל מתחיל כאן.</h1><p id="subtitle"></p><a href="#contact" class="btn">ליצירת קשר</a></div></div><main id="content" class="wrap"></main><footer id="footer"></footer>
<script>
(async()=>{
let d;try{let r=await fetch('/api/site',{cache:'no-store'});if(!r.ok)r=await fetch('site.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('config');d=await r.json()}catch(e){document.getElementById('content').textContent='לא ניתן לטעון את תוכן האתר. נסו לרענן את הדף.';return}
const root=document.documentElement;const safeColor=x=>/^#[0-9a-f]{6}$/i.test(x)?x:null;
for(const [k,v] of Object.entries({background:'--bg',surface:'--surface',accent:'--accent',text:'--text'})){const color=safeColor(d.theme?.[k]);if(color)root.style.setProperty(v,color)}
const fonts=['Arial','Georgia','Tahoma','Verdana','Trebuchet MS','Times New Roman'];if(fonts.includes(d.theme?.font))root.style.setProperty('--font',JSON.stringify(d.theme.font));
if(/^https:\/\//.test(d.heroImage||''))root.style.setProperty('--hero','url("'+encodeURI(d.heroImage).replace(/["()]/g,'')+'")');
document.title=(d.siteName||'BARBER PRO')+' | מספרה';
document.getElementById('brand').textContent='💈 '+(d.siteName||'BARBER PRO');document.getElementById('headline').textContent=d.tagline||'';document.getElementById('subtitle').textContent=d.subtitle||'';
const nav=document.getElementById('navlinks'),main=document.getElementById('content');
for(const page of (d.pages||[])){const id='page-'+String(page.id).replace(/[^a-z0-9-]/gi,'');const a=document.createElement('a');a.href='#'+id;a.textContent=page.title||'עמוד';nav.append(a);const section=document.createElement('section');section.id=id;const h=document.createElement('h2');h.textContent=page.title||'';const p=document.createElement('div');p.className='bodytext panel';p.textContent=page.content||'';section.append(h,p);if(page.id==='gallery'){const gallery=document.createElement('div');gallery.className='photos';for(const url of d.photos||[]){if(!/^https:\/\//.test(url))continue;const img=document.createElement('img');img.src=url;img.loading='lazy';img.alt='תמונת גלריה להמחשה';gallery.append(img)}section.append(gallery)}if(page.id==='contact'){const info=document.createElement('p');info.textContent=[d.address,d.hours,d.phone].filter(Boolean).join(' • ');section.append(info);if(/^972\d{8,10}$/.test(d.whatsapp||'')){const wa=document.createElement('a');wa.className='btn';wa.href='https://wa.me/'+d.whatsapp;wa.textContent='💬 קביעת תור בוואטסאפ';wa.rel='noopener noreferrer';wa.target='_blank';section.append(wa)}}main.append(section)}
document.getElementById('footer').textContent='© '+new Date().getFullYear()+' '+(d.siteName||'BARBER PRO')+' · אתר הדגמה';
})();
</script></body></html>
